[tool.pytest.ini_options]
# Permite que los tests importen main.py, utils.py y musica_api desde la raíz
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: orden de imports, UP: sintaxis moderna, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
# B008: FastAPI usa Depends()/Query() como valor por defecto, es el patrón oficial
ignore = ["B008"]
